name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, cairn]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Runner policy
        run: tests/check-runners.sh
      - name: Toolchain (Go, Node, Playwright browsers)
        run: scripts/ci-setup.sh
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Report page (typecheck, build, embedded copy is current)
        run: |
          cd report/web
          npm ci --no-audit --no-fund
          npm run check
          npm run build
          git diff --exit-code -- ../dist || { echo "report/dist is stale: run npm run build in report/web and commit"; exit 1; }
      - name: go vet
        run: go vet ./... && (cd tests/browsers && go vet ./...)
      - name: Unit and end-to-end tests (real Chrome)
        env:
          BNS_E2E_KEEP: ${{ runner.temp }}/e2e-site
        run: go test -race -count=1 -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1
      - name: Chromium, Firefox and WebKit on the end-to-end snapshot
        run: |
          go build -o "$RUNNER_TEMP/bns" .
          "$RUNNER_TEMP/bns" serve -out "$RUNNER_TEMP/e2e-site" -addr 127.0.0.1:8765 &
          trap 'kill %1' EXIT
          sleep 1
          cd tests/browsers && go run . -url http://127.0.0.1:8765 -pages /ui/dashboard,/ui/analytics,@detail -settle 2s
      - name: Cross-build
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null . && echo "ok $target"
          done
      - name: Container image (build only)
        run: cd tools/mkimage && go run . -binary-dir "$RUNNER_TEMP/none" -check
