name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: [self-hosted, cairn]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Runner policy
        run: tests/check-runners.sh
      - name: Toolchain
        run: scripts/ci-setup.sh
      - name: Tests
        run: go vet ./... && go test -race -count=1 ./...
      - name: Binaries
        run: scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
      - name: Container image (linux/amd64 + linux/arm64) to ghcr.io
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          cd tools/mkimage
          go run . -binary-dir "$GITHUB_WORKSPACE/build" -version "$GITHUB_REF_NAME" \
            -repo ghcr.io/parkwardrr/birdnet-snapshot -push
